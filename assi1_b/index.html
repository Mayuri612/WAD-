<!DOCTYPE html>
<html>
    <head>
        <title>JSON Table with Modal Form</title>
<style>
body { font-family: Arial; }

table {
            
    margin: auto;
    border-collapse: separate;
    border-spacing: 1px;
    width: 60%;
    overflow: hidden;
        
}
th{
    background: #d4f1f3;
            
}

th, td {
    border-radius: 5px;
            
    border: 2px solid black;
    padding: 10px;
    text-align: center;
}


.modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
           
}

.modal-content {
    border-radius: 50px;
    background: white;
    padding: 30px;
    width: 300px;
    margin: 100px auto;
}
.modal-content div{
    text-align: center;
}

label {
    display: block;
    margin-top: 10px;
    font-weight: bold;
}

input {
    display: block;
    width: 100%;
    padding: 10px;
    margin-top: 5px;
    box-sizing: border-box;
    background: rgb(187, 183, 183);
    margin-bottom: 20px;
}
#addUser{
    text-align: center;
    margin-top: 25px;
}
    
        
        

button{
    font-size: medium;
    font-weight: bold;
    background: rgb(43, 107, 43);
    color: white;
    padding: 10px;
    border-radius: 10px;
            
}

#formbutton button{
    margin: 10px;
}
        
</style>
        
    </head>
    <body>

        
        
         <div id="addUser">
        <button onclick="openModal()">Add User</button>
        </div>
        <br><br>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>city</th>
                </tr>

            </thead>
            <tbody id="tableBody"></tbody>
        </table>

       
        <div id="myModal" class="modal">
    <div class="modal-content">
        

        <label>Name:</label>
        <input type="text" id="name">

        <label>Email:</label>
        <input type="email" id="email">  

        <label>Phone:</label>
        <input type="text" id="phone">

        <label>City:</label>
        <input type="text" id="city"><br><br>

        <div>
            <button onclick="addUser()">Submit</button>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>
</div>

        <script src="script.js"></script>

    </body>
</html>
